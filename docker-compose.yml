
services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: cortex-falkordb
    ports:
      - "6379:6379"
      - "3001:3000"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  cortex-app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cortex-app
    ports:
      - "8000:8000"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - DEFAULT_TENANT=acme_corp
      - CORTEX_ADMIN_API_KEY=ksiIs3CNBtG3OBVsCIlGeeQ8vXLWjnNf5K57fbWsWLM=
    depends_on:
      falkordb:
        condition: service_healthy
